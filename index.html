<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1A1A2E">
    <title>Vocab Monster</title>
    <link rel="preconnect" href="https://fonts.loli.net">
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.loli.net/css2?family=Bebas+Neue&amp;family=Lexend:wght@300;400;600;800&amp;family=Playfair+Display:ital,wght@0,700;1,700&amp;family=Space+Mono:wght@400;700&amp;display=swap">
    <link rel="preload" href="/fonts/material-symbols-cae56fc2b754.woff2" as="font" type="font/woff2" crossorigin>
    <!-- The small boot screen is styled before the application CSS arrives. -->
    <style>
        body { margin: 0; background: #1A1A2E; color: #E0E0E0; }
        #loading-screen { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: #1A1A2E; }
        .loader-content { width: min(22rem, 86vw); text-align: center; }
        .loader-monster { width: 120px; height: 120px; object-fit: contain; margin: 0 auto 2rem; display: block; filter: drop-shadow(0 0 20px #00f0ff4d); animation: monsterBreathe 3s ease-in-out infinite; }
        .loader-title { margin: 0 0 2rem; font: 3.5rem/1 Impact, 'Arial Narrow', sans-serif; letter-spacing: -.02em; color: #00F0FF; background: linear-gradient(135deg, #BB00FF, #00F0FF, #BB00FF); background-size: 200% 200%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: loaderFlow 8s linear infinite; }
        .loader-bar-container { height: 2px; overflow: hidden; background: #ffffff0d; border-radius: 1px; }
        .loader-bar { height: 100%; width: 35%; background: #00F0FF; animation: loaderProgress 1.2s ease-in-out infinite alternate; }
        .loader-text { margin-top: 1rem; color: #00F0FF; font: .8rem/1.5 ui-monospace, monospace; }
        @keyframes loaderFlow { 50% { background-position: 100% 50%; } }
        @keyframes monsterBreathe { 50% { transform: translateY(-10px) scale(1.05); } }
        @keyframes loaderProgress { to { transform: translateX(185%); } }
        @media (prefers-reduced-motion: reduce) { .loader-monster, .loader-title, .loader-bar { animation: none; } }
    </style>
</head>
<body>
    <div id="loading-screen" role="status" aria-live="polite" aria-label="正在启动应用">
        <div class="loader-content">
            <img alt="" class="loader-monster" id="loader-monster" width="120" height="120" decoding="async">
            <h1 class="loader-title">VOCAB MONSTER</h1>
            <div class="loader-bar-container" aria-hidden="true"><div class="loader-bar"></div></div>
            <div class="loader-text" id="loading-text">INITIALIZING SYSTEMS...</div>
            <noscript><p>请启用 JavaScript 后使用 Vocab Monster。</p></noscript>
        </div>
    </div>
    <div id="root"></div>
    <script>
        document.getElementById('loader-monster').src = `/monsterImages/M${new Date().getDay()}.webp`;
    </script>
    <script type="module" src="/index.tsx" onerror="document.getElementById('loading-text').textContent='启动失败，请刷新页面重试。'"></script>
</body>
</html>
